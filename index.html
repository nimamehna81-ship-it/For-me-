<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Pretty Notes</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h1>🌸 Pretty Notes</h1>

        <button id="newFolder">
            ➕ New Folder
        </button>

        <input
        type="text"
        id="search"
        placeholder="🔍 Search notes...">

        <div class="sectionTitle">
            📁 Folders
        </div>

        <div id="folders"></div>

        <div class="sectionTitle">
            📝 Notes
        </div>

        <div id="notesList"></div>

    </aside>

    <!-- Main -->

    <main class="main">

        <div class="toolbar">

            <input
            id="title"
            placeholder="Untitled Note">

            <button id="favorite">
                ⭐
            </button>

            <button id="newNote">
                📝 New Note
            </button>

        </div>

        <textarea
        id="editor"
        placeholder="Start writing your beautiful notes here... 🌸"></textarea>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
